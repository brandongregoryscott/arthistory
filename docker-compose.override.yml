# Local development uses an isolated network and opts into tunnels explicitly.
services:
  api:
    volumes:
      - ${MIGRATION_DATA_PATH:-./migration-data}:/migration

  tunnel:
    profiles: ["tunnels"]

  pocketbase-tunnel:
    profiles: ["tunnels"]

networks:
  observability:
    external: false
    name: ${COMPOSE_PROJECT_NAME:-arthistory}-observability-local
