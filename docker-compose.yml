services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - PORT=3001
      - DATABASE_PATH=/data/_spotify-data.db
      - METRICS_HOST=0.0.0.0
      - METRICS_PORT=9464
    networks:
      default:
      observability:
        aliases:
          - arthistory-api-metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /home/brandon/arthistory/data:/data

  # cron:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.cron
  #   env_file: .env
  #   volumes:
  #     - /home/brandon/arthistory/data:/data

  tunnel:
    image: tuns-tunnel:latest # built locally on the host from the tuns-tunnel repo
    pull_policy: never
    environment:
      - TUNS_NAME=arthistory-api
      - TARGET_HOST=api
      - TARGET_PORT=3001
    depends_on:
      - api
    volumes:
      - /root/.ssh/tuns_ed25519:/root/.ssh/id_ed25519:ro
    restart: always

volumes:
  data:

networks:
  observability:
    external: true
    name: observability
