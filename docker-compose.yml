services:
    pocketbase:
        build:
            context: .
            dockerfile: Dockerfile.pocketbase
        environment:
            POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL:-}
            POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD:-}
        ports:
            # Use an app-specific host port; other PocketBase apps share this host.
            - "127.0.0.1:${DB_PORT:-6769}:8090"
        volumes:
            - pocketbase-data:/pb_data
        restart: unless-stopped

    pocketbase-tunnel:
        image: tuns-tunnel:latest # built locally on the host from the tuns-tunnel repo
        pull_policy: never
        environment:
            TUNS_NAME: ${POCKETBASE_TUNNEL_NAME:-arthistory-pocketbase}
            TARGET_HOST: pocketbase
            TARGET_PORT: 8090
        depends_on:
            pocketbase:
                condition: service_healthy
        volumes:
            - ${TUNS_SSH_KEY_PATH:-/root/.ssh/tuns_ed25519}:/root/.ssh/id_ed25519:ro
        restart: unless-stopped

    api:
        build:
            context: .
            dockerfile: Dockerfile.api
        volumes:
            - ${MIGRATION_DATA_PATH:-/root/arthistory-migration}:/migration
        ports:
            # Public requests must pass through the header-rewriting HTTP tunnel.
            - "127.0.0.1:${PORT:-6768}:6768"
        env_file: .env
        environment:
            - TRUST_PROXY_HOPS=1
            - PORT=6768

            - POCKETBASE_URL=http://pocketbase:8090

            - METRICS_HOST=0.0.0.0
            - METRICS_PORT=9464
            - SOURCE_COMMIT=${SOURCE_COMMIT:-}
        networks:
            default:
            observability:
                aliases:
                    - arthistory-api-metrics
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:6768/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            pocketbase:
                condition: service_healthy

    tunnel:
        image: tuns-tunnel:latest # built locally on the host from the tuns-tunnel repo
        pull_policy: never
        environment:
            - TUNS_NAME=arthistory-api
            - TARGET_HOST=api
            - TARGET_PORT=6768
        depends_on:
            - api
        volumes:
            - /root/.ssh/tuns_ed25519:/root/.ssh/id_ed25519:ro
        restart: always

volumes:
    pocketbase-data:

networks:
    observability:
        external: true
        name: observability
