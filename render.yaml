services:
    - type: web
      name: arthistory-web

      autoDeploy: true
      branch: main
      buildCommand: npm ci && npm run build
      rootDir: apps/web
      runtime: static
      staticPublishPath: out
      domains:
          - arthistory.brandonscott.me
      envVars:
          - key: NEXT_PUBLIC_API_URL
            value: https://bscott-arthistory-api.tuns.sh