services:
    - type: web
      name: arthistory-web

      autoDeploy: true
      branch: main
      buildCommand: npm ci && npm run build
      rootDir: apps/web
      runtime: static
      staticPublishPath: dist
      domains:
          - arthistory.brandonscott.me
      envVars:
          - key: VITE_API_URL
            value: https://bscott-arthistory-api.tuns.sh
      routes:
          - type: rewrite
            source: /*
            destination: /index.html
