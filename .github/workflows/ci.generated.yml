# Generated by ci.mts. Run npm run ci:generate; do not edit directly.

name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.event_name != ''push'' }}'
defaults:
  run:
    shell: bash
jobs:
  changes:
    name: affected jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflow: '${{ steps.detect.outputs.workflow }}'
      quality: '${{ steps.detect.outputs.quality }}'
      api: '${{ steps.detect.outputs.api }}'
      web: '${{ steps.detect.outputs.web }}'
      scripts: '${{ steps.detect.outputs.scripts }}'
      api_container: '${{ steps.detect.outputs.api_container }}'
      cron_container: '${{ steps.detect.outputs.cron_container }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Detect affected jobs
        id: detect
        run: node .github/ci.ts detect
  workflow:
    name: workflow
    needs:
      - changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check workflow source and generation
        run: |-
          npm run ci:typecheck
          npm run ci:lint
          npm run ci:test
          npm run ci:check
          npm exec prettier -- --check .github/workflows/ci.mts .github/ci.ts .github/ci.test.ts .github/tsconfig.json .github/eslint.config.mjs
      - uses: 'docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667'
        with:
          args: '-color .github/workflows/ci.generated.yml'
  quality:
    name: format and lint
    needs:
      - changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and lint
        run: |-
          npm run format
          npm run lint
  api:
    name: API checks
    needs:
      - changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check API
        run: |-
          npm run typecheck --workspace=api
          npm run test --workspace=api
          npm run build --workspace=api
  web:
    name: web checks
    needs:
      - changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check web
        run: |-
          npm run typecheck --workspace=web
          npm run build --workspace=web
  scripts:
    name: script checks
    needs:
      - changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check scripts
        run: npm run typecheck --workspace=scripts
  api_container:
    name: container (api)
    needs:
      - changes
    if: needs.changes.outputs.api_container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: 'ci-api:check'
          build-args: 'SOURCE_VERSION=${{ github.sha }}'
          cache-from: 'type=gha,scope=api'
          cache-to: 'type=gha,mode=max,scope=api'
      - name: Check native SQLite
        run: 'docker run --rm --entrypoint node ci-api:check -e "require(''./build/Release/node_sqlite3.node'')"'
  cron_container:
    name: container (cron)
    needs:
      - changes
    if: needs.changes.outputs.cron_container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.cron
          push: false
          load: true
          tags: 'ci-cron:check'
          build-args: 'SOURCE_VERSION=${{ github.sha }}'
          cache-from: 'type=gha,scope=cron'
          cache-to: 'type=gha,mode=max,scope=cron'
      - name: Check native SQLite
        run: 'docker run --rm --entrypoint node ci-cron:check -e "const sqlite = require(''/app/node_modules/sqlite3''); const db = new sqlite.Database('':memory:''); db.exec(''CREATE TABLE smoke (id INTEGER)'', error => { if (error) throw error; db.close(); });"'
  ci:
    name: ci
    needs:
      - changes
      - workflow
      - quality
      - api
      - web
      - scripts
      - api_container
      - cron_container
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require affected checks to succeed
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
        run: node .github/ci.ts check
