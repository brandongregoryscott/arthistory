# Generated by ci.mts. Run npm run ci:generate; do not edit directly.

name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.event_name != ''push'' }}'
defaults:
  run:
    shell: bash
jobs:
  workflow:
    name: workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check workflow source and generation
        run: |-
          npm run ci:typecheck
          npm run ci:lint
          npm run ci:check
          npm exec prettier -- --check .github/workflows/ci.mts .github/tsconfig.json .github/eslint.config.mjs
      - uses: 'docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667'
        with:
          args: '-color .github/workflows/ci.generated.yml'
  checks:
    name: '${{ matrix.script }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        script:
          - format
          - lint
          - typecheck
          - test
          - build
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run check
        run: 'npm run ${{ matrix.script }}'
  containers:
    name: 'container (${{ matrix.image }})'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image:
          - api
          - cron
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: 'Dockerfile.${{ matrix.image }}'
          push: false
          load: true
          tags: 'ci-${{ matrix.image }}:check'
          build-args: 'SOURCE_VERSION=${{ github.sha }}'
          cache-from: 'type=gha,scope=${{ matrix.image }}'
          cache-to: 'type=gha,mode=max,scope=${{ matrix.image }}'
      - name: Load API SQLite binding
        if: matrix.image == 'api'
        run: 'docker run --rm --entrypoint node ci-api:check -e "require(''./build/Release/node_sqlite3.node'')"'
      - name: Query cron SQLite database
        if: matrix.image == 'cron'
        run: 'docker run --rm --entrypoint node ci-cron:check -e "const sqlite = require(''/app/node_modules/sqlite3''); const db = new sqlite.Database('':memory:''); db.exec(''CREATE TABLE smoke (id INTEGER)'', error => { if (error) throw error; db.close(); });"'
  ci:
    name: ci
    needs:
      - workflow
      - checks
      - containers
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation to succeed
        env:
          RESULTS: '${{ join(needs.*.result, '' '') }}'
        run: |-
          if [[ -z "$RESULTS" ]]; then
              echo "No validation results were provided"
              exit 1
          fi
          read -r -a results <<< "$RESULTS"
          for result in "${results[@]}"; do
              if [[ "$result" != "success" ]]; then
                  echo "Validation result: $result"
                  exit 1
              fi
          done
  release:
    name: semantic-release
    needs:
      - ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: semantic-release
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix .github/release
      - name: Release
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: npm exec --prefix .github/release --no -- semantic-release
