name: build

on:
    push:
        branches: ["*"]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  cache: 'npm'
                  node-version: 24.11.0

            - name: npm ci
              run: npm ci

            - name: npm run lint
              run: npm run lint

    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  cache: 'npm'
                  node-version: 24.11.0

            - name: npm ci
              run: npm ci

            - name: npm run format
              run: npm run format

    build:
        runs-on: ubuntu-latest
        needs: [lint, format]
        steps:
            - uses: actions/checkout@v7

            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  cache: 'npm'
                  node-version: 24.11.0

            - name: npm ci
              run: npm ci

            - name: npm run build
              run: npm run build

    docker:
        name: docker build (${{ matrix.image }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                image: [api, cron, tunnel]
        steps:
            - uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build ${{ matrix.image }} image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.${{ matrix.image }}
                  push: false
                  load: false
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}

    release:
        name: semantic-release
        runs-on: ubuntu-latest
        needs: [build, docker]
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        steps:
            - uses: actions/checkout@v7

            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  cache: 'npm'
                  node-version: 24.11.0

            - name: Install semantic-release
              run: npm i -g semantic-release

            - name: Release
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
              run: npx semantic-release


